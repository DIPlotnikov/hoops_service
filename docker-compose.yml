name: hoops_service
services:
   db:
     image: postgres:13-alpine3.16
     container_name: db_hoops_service
     restart: always
     volumes:
       - pgdata:/var/lib/postgresql/data
     env_file: .env
     ports:
       - "127.0.0.1:5433:5432"
     networks:
       - hoops_service_link
   db_mysql:
     image: mysql:8
     restart: always
     env_file: .env
     ports:
       - "127.0.0.1:13306:3306"
     volumes:
       - mysql_data:/var/lib/mysql
     networks:
       - hoops_service_link
     healthcheck:
       test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
       interval: 10s
       timeout: 5s
       retries: 10
   app:
     build: core/.
     container_name: app_hoops_service
     restart: always
     command: sh -c "/usr/local/bin/gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8000"
     volumes:
       - ./core:/code
       - logs:/logs
       - minio-shared:/usr/local/share/minio
     ports:
       - "127.0.0.1:18000:8000"
     env_file: .env
     depends_on:
       db:
         condition: service_started
       db_mysql:
         condition: service_healthy
       redis:
         condition: service_healthy
       minio:
          condition: service_started
     links:
       - db:db
       - db_mysql:db_mysql
     networks:
       - hoops_service_link
   minio:
     image: minio/minio:RELEASE.2024-06-13T22-53-53Z
     container_name: minio_hoops_service
     command: server /data --console-address ":9001"
     restart: always
     environment:
       - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
       - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
     volumes:
       - minio-shared:/data
     ports:
       - "127.0.0.1:9000:9000"
       - "127.0.0.1:9001:9001"
     networks:
       - hoops_service_link
   redis:
     image: redis:7-alpine
     container_name: redis_hoops_service
     restart: always
     volumes:
       - redis-data:/data
     ports:
           - "127.0.0.1:6380:6379"
     networks:
       - hoops_service_link
     healthcheck:
       test: ["CMD", "redis-cli", "ping"]
       interval: 10s
       timeout: 5s
       retries: 10

   celery:
     build: core/.
     container_name: celery_hoops_service
     command: celery -A core worker -l info
     env_file:
       - .env
     networks:
       - hoops_service_link
     volumes:
       - ./core:/code
       - logs:/logs
       - minio-shared:/usr/local/share/minio
     depends_on:
       app:
         condition: service_started
       redis:
         condition: service_healthy
       db_mysql:
         condition: service_healthy

networks:
   hoops_service_link:
     driver: bridge
volumes:
  mysql_data:
    driver: local
  pgdata:
    driver: local
  redis-data:
    driver: local
  logs:
    driver: local
  minio-shared:
    driver: local
